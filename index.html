<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>PopMinutes Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ========== RESET & BASE ========== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: 'Be Vietnam Pro', sans-serif; background: #F8FAFC; color: #0F172A; display: flex; }

        /* ========== LOGIN OVERLAY ========== */
        .pa-login-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 99999; padding: 20px; }
        .pa-login-card { background: #fff; width: 100%; max-width: 400px; border-radius: 20px; padding: 32px 28px; text-align: center; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3); }
        .pa-login-icon { width: 64px; height: 64px; background: #EEF2FF; color: #1B2B7A; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 16px; }
        .pa-login-card h2 { font-size: 20px; font-weight: 800; color: #1B2B7A; margin: 0 0 6px; }
        .pa-login-card p { font-size: 13px; color: #64748B; margin: 0 0 20px; }
        .pa-login-form { display: flex; flex-direction: column; gap: 12px; }
        .pa-login-input { width: 100%; padding: 13px 16px; border: 1.5px solid #E2E8F0; border-radius: 12px; font-size: 14.5px; font-family: inherit; color: #0F172A; outline: none; transition: border-color 0.15s; }
        .pa-login-input:focus { border-color: #1B2B7A; box-shadow: 0 0 0 4px rgba(27, 43, 122, 0.1); }
        .pa-login-btn { width: 100%; padding: 13px; background: #1B2B7A; color: #fff; border: none; border-radius: 12px; font-family: inherit; font-weight: 700; font-size: 14.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .pa-login-err { margin-top: 14px; padding: 10px 14px; background: #FEF2F2; border: 1px solid #FECACA; color: #DC2626; border-radius: 10px; font-size: 12.5px; font-weight: 600; text-align: left; }

        /* ========== LAYOUT (SIDEBAR + MAIN) ========== */
        #paAdminContent { display: none; width: 100%; height: 100%; }

        /* Sidebar */
        .pa-sidebar {
            width: 260px;
            background: #1B2B7A;
            color: #fff;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            z-index: 50;
        }
        .pa-sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .pa-sidebar-header i { font-size: 24px; color: #FCD34D; }
        .pa-sidebar-header h2 { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
        
        .pa-nav { flex: 1; padding: 20px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .pa-nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 16px; border-radius: 12px;
            color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 600;
            text-decoration: none; cursor: pointer; transition: 0.2s;
            border: none; background: transparent; width: 100%; text-align: left;
        }
        .pa-nav-item:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .pa-nav-item.active { background: #fff; color: #1B2B7A; font-weight: 700; }
        
        .pa-sidebar-footer { padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .pa-logout-btn {
            width: 100%; padding: 12px; border-radius: 12px;
            background: rgba(239, 68, 68, 0.2); color: #FCA5A5;
            border: 1px solid rgba(239, 68, 68, 0.3); font-weight: 700; font-family: inherit; font-size: 13.5px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s;
        }
        .pa-logout-btn:hover { background: #EF4444; color: #fff; }

        /* Main Content */
        .pa-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #F8FAFC; }
        
        .pa-topbar {
            height: 70px; background: #fff; border-bottom: 1px solid #E2E8F0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; flex-shrink: 0;
        }
        .pa-topbar h1 { font-size: 20px; font-weight: 800; color: #1B2B7A; }
        .pa-menu-toggle { display: none; background: none; border: none; font-size: 20px; color: #64748B; cursor: pointer; }

        .pa-content-area { flex: 1; padding: 24px; overflow-y: auto; }
        .pa-view { display: none; }
        .pa-view.active { display: block; animation: paFadeIn 0.3s; }

        /* ========== COMPONENTS ========== */
        .pa-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .pa-stat { background: #fff; border: 1px solid #E2E8F0; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .pa-stat-val { font-size: 26px; font-weight: 800; color: #D97706; margin-bottom: 4px; }
        .pa-stat-lbl { font-size: 12px; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 0.5px; }

        .pa-filters { display: flex; gap: 12px; margin-bottom: 20px; background: #fff; padding: 16px; border-radius: 16px; border: 1px solid #E2E8F0; }
        .pa-filters input, .pa-filters select { padding: 10px 16px; border: 1.5px solid #E2E8F0; border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 600; color: #1B2B7A; outline: none; }
        .pa-btn-refresh { padding: 10px 20px; background: #F1F5F9; color: #1B2B7A; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .pa-btn-refresh:hover { background: #E2E8F0; }

        .pa-loading { text-align: center; padding: 60px 20px; color: #64748B; font-size: 14px; background: #fff; border-radius: 16px; border: 1px dashed #CBD5E1; }

        /* Group / Cards */
        .pa-group { background: #fff; border: 1px solid #E2E8F0; border-radius: 16px; margin-bottom: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .pa-group-header { padding: 18px 24px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid transparent; }
        .pa-group.expanded .pa-group-header { border-bottom-color: #E2E8F0; background: #F8FAFC; }
        .pa-partner-name { font-weight: 800; font-size: 16px; color: #1B2B7A; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .pa-group-body { padding: 24px; display: none; }
        .pa-group.expanded .pa-group-body { display: block; }
        .pa-chevron { transition: transform 0.2s; color: #64748B; }
        .pa-group.expanded .pa-chevron { transform: rotate(180deg); }

        .pa-bank-card { background: #F1F5F9; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .pa-bank-card-title { font-size: 12px; font-weight: 800; color: #475569; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .pa-bank-rows { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .pa-bank-row-label { font-size: 11px; color: #64748B; display: block; margin-bottom: 2px; }
        .pa-bank-row-value { font-weight: 700; color: #0F172A; word-break: break-word; }

        .pa-comm { background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; padding: 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .pa-comm-email { font-weight: 700; font-size: 14px; color: #0F172A; margin-bottom: 6px; }
        .pa-comm-meta { font-size: 12.5px; color: #64748B; line-height: 1.6; }
        .pa-comm-amount { font-size: 16px; font-weight: 800; color: #D97706; text-align: right; margin-bottom: 8px; }
        .pa-paid-btn { background: #10B981; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .pa-paid-btn:hover { background: #059669; }
        .pa-mark-all-btn { width: 100%; background: #1B2B7A; color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; }
        .pa-mark-all-btn:hover { background: #131F5C; }

        /* Toast */
        .pa-toast { position: fixed; bottom: 30px; right: 30px; transform: translateY(20px); background: #1B2B7A; color: #fff; padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 700; z-index: 999999; opacity: 0; transition: 0.3s; pointer-events: none; box-shadow: 0 10px 30px rgba(27,43,122,0.3); }
        .pa-toast.show { opacity: 1; transform: translateY(0); }
        .pa-toast.error { background: #DC2626; }

        /* Responsive */
        @media (max-width: 768px) {
            .pa-sidebar { position: fixed; transform: translateX(-100%); height: 100%; }
            .pa-sidebar.open { transform: translateX(0); }
            .pa-menu-toggle { display: block; }
            .pa-stats { grid-template-columns: 1fr; }
            .pa-filters { flex-direction: column; }
        }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="paLoginScreen" class="pa-login-overlay">
    <div class="pa-login-card">
        <div class="pa-login-icon"><i class="fa-solid fa-shield-halved"></i></div>
        <h2>PopMinutes Admin</h2>
        <p>Nhập mật khẩu quản trị để tiếp tục</p>
        <div class="pa-login-form">
            <input type="password" id="paPasswordInput" class="pa-login-input" placeholder="Mật khẩu Admin">
            <button id="paLoginBtn" class="pa-login-btn" onclick="paLogin()">
                <i class="fa-solid fa-right-to-bracket"></i> <span>Đăng nhập</span>
            </button>
        </div>
        <div id="paLoginErr" class="pa-login-err" style="display:none;"></div>
    </div>
</div>

<!-- MAIN DASHBOARD -->
<div id="paAdminContent">
    
    <!-- SIDEBAR -->
    <aside class="pa-sidebar" id="paSidebar">
        <div class="pa-sidebar-header">
            <i class="fa-solid fa-chart-pie"></i>
            <h2>PopMinutes</h2>
        </div>
        <div class="pa-nav">
            <button class="pa-nav-item active" onclick="switchAdminView('affiliate', this)">
                <i class="fa-solid fa-coins"></i> Duyệt Affiliate
            </button>
            <button class="pa-nav-item" onclick="switchAdminView('cafe', this)">
                <i class="fa-solid fa-store"></i> Quán Cafe
            </button>
        </div>
        <div class="pa-sidebar-footer">
            <button class="pa-logout-btn" onclick="paLogout()">
                <i class="fa-solid fa-power-off"></i> Đăng xuất
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="pa-main">
        <!-- TOPBAR -->
        <header class="pa-topbar">
            <div style="display: flex; align-items: center; gap: 16px;">
                <button class="pa-menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                <h1 id="paPageTitle">Duyệt Affiliate</h1>
            </div>
        </header>

        <!-- CONTENT AREA -->
        <div class="pa-content-area">
            
            <!-- VIEW: AFFILIATE -->
            <div id="view-affiliate" class="pa-view active">
                <div class="pa-stats">
                    <div class="pa-stat"><div class="pa-stat-val" id="paTotalPending">—</div><div class="pa-stat-lbl">Tổng Tiền Chờ Trả</div></div>
                    <div class="pa-stat"><div class="pa-stat-val" id="paTotalCount" style="color:#2563EB;">—</div><div class="pa-stat-lbl">Số Khoản Chờ</div></div>
                    <div class="pa-stat"><div class="pa-stat-val" id="paPartnerCount" style="color:#059669;">—</div><div class="pa-stat-lbl">Số Đối Tác</div></div>
                </div>
                <div class="pa-filters">
                    <button class="pa-btn-refresh" onclick="loadAffiliate()"><i class="fa-solid fa-arrows-rotate"></i> Làm mới dữ liệu</button>
                </div>
                <div id="paList"><div class="pa-loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải...</div></div>
            </div>

            <!-- VIEW: CAFE -->
            <div id="view-cafe" class="pa-view">
                <div class="pa-stats">
                    <div class="pa-stat"><div class="pa-stat-val" id="cafeTotalAmount">—</div><div class="pa-stat-lbl">Tổng Doanh Thu</div></div>
                    <div class="pa-stat"><div class="pa-stat-val" id="cafeTotalUnpaid" style="color: #DC2626;">—</div><div class="pa-stat-lbl">Chưa Thanh Toán</div></div>
                    <div class="pa-stat"><div class="pa-stat-val" id="cafeTotalPaid" style="color: #059669;">—</div><div class="pa-stat-lbl">Đã Thanh Toán</div></div>
                </div>
                
                <div class="pa-filters">
                    <input type="month" id="cafeMonthPicker" onchange="loadCafeRevenue()" style="flex: 1; max-width: 200px;">
                    <select id="cafePayFilter" onchange="filterAndRenderCafes()" style="flex: 1; max-width: 200px;">
                        <option value="all">Tất cả Bill</option>
                        <option value="unpaid" selected>Chưa thanh toán</option>
                        <option value="paid">Đã thanh toán</option>
                    </select>
                    <button class="pa-btn-refresh" onclick="loadCafeRevenue()"><i class="fa-solid fa-arrows-rotate"></i> Làm mới</button>
                </div>
                
                <div id="paListCafe"><div class="pa-loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...</div></div>
            </div>

        </div>
    </main>
</div>

<div id="paToast" class="pa-toast"></div>

<script>
    const CLOUD_URL = 'https://get-upload-url-test-824148866382.asia-southeast1.run.app';
    const ADMIN_EMAIL = 'info@pophubly.com';
    const TOKEN_KEY = 'popminutes_admin_token';

    let allCafeData = [];

    // Helpers
    function paFmt(n) { return Number(n || 0).toLocaleString('vi-VN'); }
    function paFmtDate(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
    }
    function escapeHtml(s) {
        if (!s) return '';
        return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function paToast(msg, isSuccess) {
        const t = document.getElementById('paToast');
        t.textContent = msg;
        t.className = 'pa-toast show' + (isSuccess === false ? ' error' : '');
        clearTimeout(t._hideTimer);
        t._hideTimer = setTimeout(() => { t.className = 'pa-toast' + (isSuccess === false ? ' error' : ''); }, 3000);
    }
    function paGetToken() { return sessionStorage.getItem(TOKEN_KEY) || ''; }

    // Auth
    window.paLogin = async function() {
        const pwd = document.getElementById('paPasswordInput').value;
        if (!pwd) return document.getElementById('paLoginErr').textContent = 'Nhập mật khẩu';
        
        const btn = document.getElementById('paLoginBtn');
        btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

        try {
            const res = await fetch(CLOUD_URL, {
                method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: new URLSearchParams({ action: 'affiliateAdminLogin', password: pwd }).toString()
            });
            const data = await res.json();
            if (data.status === 200) {
                sessionStorage.setItem(TOKEN_KEY, data.token);
                document.getElementById('paLoginScreen').style.display = 'none';
                document.getElementById('paAdminContent').style.display = 'flex';
                switchAdminView('affiliate', document.querySelector('.pa-nav-item')); // Load tab mặc định
            } else {
                document.getElementById('paLoginErr').textContent = data.message || 'Sai mật khẩu';
                document.getElementById('paLoginErr').style.display = 'block';
            }
        } catch (e) {
            document.getElementById('paLoginErr').textContent = 'Lỗi kết nối';
            document.getElementById('paLoginErr').style.display = 'block';
        } finally {
            btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> <span>Đăng nhập</span>';
        }
    };

    window.paLogout = function() {
        if (!confirm('Đăng xuất?')) return;
        sessionStorage.removeItem(TOKEN_KEY);
        window.location.reload();
    };

    // Navigation
    window.switchAdminView = function(view, btn) {
        // Update menu active
        document.querySelectorAll('.pa-nav-item').forEach(el => el.classList.remove('active'));
        if(btn) btn.classList.add('active');
        else {
            // Nếu gọi từ code, tự tìm nút tương ứng
            const targetBtn = Array.from(document.querySelectorAll('.pa-nav-item')).find(el => el.getAttribute('onclick').includes(view));
            if(targetBtn) targetBtn.classList.add('active');
        }

        // Update title
        document.getElementById('paPageTitle').textContent = view === 'affiliate' ? 'Duyệt Affiliate' : 'Đối soát Quán Cafe';

        // Toggle views
        document.getElementById('view-affiliate').classList.toggle('active', view === 'affiliate');
        document.getElementById('view-cafe').classList.toggle('active', view === 'cafe');

        // Đóng sidebar trên mobile
        document.getElementById('paSidebar').classList.remove('open');

        // Load data
        if (view === 'affiliate') loadAffiliate();
        else loadCafeRevenue();
    };

    window.toggleSidebar = function() {
        document.getElementById('paSidebar').classList.toggle('open');
    };

    // ===== 1. AFFILIATE LOGIC =====
    window.loadAffiliate = async function() {
        const list = document.getElementById('paList');
        list.innerHTML = '<div class="pa-loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải...</div>';
        try {
            const res = await fetch(`${CLOUD_URL}?action=affiliateListPendingCommissions&adminToken=${paGetToken()}`);
            const data = await res.json();
            if (data.status !== 200) throw new Error(data.message);

            document.getElementById('paTotalPending').textContent = paFmt(data.total_amount) + 'đ';
            document.getElementById('paTotalCount').textContent = data.total_count;
            document.getElementById('paPartnerCount').textContent = data.partner_count;

            if (data.commissions.length === 0) return list.innerHTML = '<div class="pa-loading">🎉 Không có khoản nào cần duyệt!</div>';

            const groups = {};
            data.commissions.forEach(c => {
                if (!groups[c.partner_id]) groups[c.partner_id] = { partner: c, items: [], subtotal: 0 };
                groups[c.partner_id].items.push(c);
                groups[c.partner_id].subtotal += Number(c.commission_amount);
            });

            list.innerHTML = Object.values(groups).map(g => {
                const bank = g.partner.partner_info || {};
                const isPaypal = bank.method === 'paypal';
                
                let bankHtml = '';
                if (isPaypal && (bank.paypal_email || bank.paypal_name)) {
                    bankHtml = `<div class="pa-bank-card"><div class="pa-bank-card-title"><i class="fa-brands fa-paypal"></i> PayPal</div><div class="pa-bank-rows"><div class="pa-bank-row"><span class="pa-bank-row-label">Email</span><span class="pa-bank-row-value">${escapeHtml(bank.paypal_email)}</span></div></div></div>`;
                } else if (!isPaypal && (bank.bank_name || bank.bank_account)) {
                    bankHtml = `<div class="pa-bank-card"><div class="pa-bank-card-title"><i class="fa-solid fa-building-columns"></i> Bank</div><div class="pa-bank-rows"><div class="pa-bank-row"><span class="pa-bank-row-label">NH</span><span class="pa-bank-row-value">${escapeHtml(bank.bank_name)}</span></div><div class="pa-bank-row"><span class="pa-bank-row-label">STK</span><span class="pa-bank-row-value">${escapeHtml(bank.bank_account)}</span></div></div></div>`;
                } else {
                    bankHtml = `<div class="pa-bank-card" style="background:#FEF2F2;color:#DC2626;"><div class="pa-bank-card-title">Chưa có thông tin</div></div>`;
                }

                const itemsHtml = g.items.map(c => `
                    <div class="pa-comm">
                        <div style="flex:1;">
                            <div class="pa-comm-email">${escapeHtml(c.customer_email)}</div>
                            <div class="pa-comm-meta">${c.package_id} · ${paFmtDate(c.calculated_at)}</div>
                        </div>
                        <div style="text-align:right;">
                            <div class="pa-comm-amount">+${paFmt(c.commission_amount)}đ</div>
                            <button class="pa-paid-btn" onclick="paMarkPaid('${c.commission_id}', ${c.commission_amount}, this)"><i class="fa-solid fa-check"></i> Duyệt</button>
                        </div>
                    </div>
                `).join('');

                const safeId = String(g.partner.partner_id).replace(/[^a-zA-Z0-9_-]/g, '_');
                return `
                    <div class="pa-group" id="grp_${safeId}">
                        <div class="pa-group-header" onclick="paToggleGroup('grp_', '${g.partner.partner_id}')">
                            <div style="flex:1;">
                                <div class="pa-partner-name"><i class="fa-solid fa-user-tie"></i> ${escapeHtml(g.partner.partner_name)}</div>
                                <div style="font-size:13px;color:#64748B;">${g.items.length} khoản · <b style="color:#D97706;">${paFmt(g.subtotal)}đ</b></div>
                            </div>
                            <i class="fa-solid fa-chevron-down pa-chevron"></i>
                        </div>
                        <div class="pa-group-body">
                            ${bankHtml}
                            ${itemsHtml}
                            <button class="pa-mark-all-btn" onclick="paMarkAll('${g.partner.partner_id}', this)"><i class="fa-solid fa-check-double"></i> Duyệt tất cả</button>
                        </div>
                    </div>
                `;
            }).join('');
            
            if (Object.keys(groups).length === 1) list.querySelector('.pa-group').classList.add('expanded');
        } catch (e) {
            list.innerHTML = `<div class="pa-loading">❌ ${e.message}</div>`;
        }
    };

    window.paToggleGroup = function(prefix, id) {
        const safeId = String(id).replace(/[^a-zA-Z0-9_-]/g, '_');
        const el = document.getElementById(prefix + safeId);
        if (el) el.classList.toggle('expanded');
    };

    window.paMarkPaid = async function(id, amt, btn) {
        if (!confirm(`Xác nhận đã chuyển ${paFmt(amt)}đ?`)) return;
        btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
        try {
            const res = await fetch(CLOUD_URL, {
                method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: new URLSearchParams({ action: 'affiliateMarkPaid', commissionId: id, adminEmail: ADMIN_EMAIL, adminToken: paGetToken() }).toString()
            });
            const data = await res.json();
            if (data.status === 200) { paToast('✅ Đã duyệt!', true); loadAffiliate(); }
            else { paToast('❌ Lỗi duyệt', false); btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-check"></i> Duyệt'; }
        } catch (e) { paToast('❌ Lỗi mạng', false); btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-check"></i> Duyệt'; }
    };

    window.paMarkAll = async function(pid, btn) {
        if (!confirm('Duyệt tất cả khoản của đối tác này?')) return;
        btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang duyệt...';
        const safeId = String(pid).replace(/[^a-zA-Z0-9_-]/g, '_');
        const btns = document.getElementById('grp_' + safeId).querySelectorAll('.pa-paid-btn');
        for (const b of btns) {
            const match = b.getAttribute('onclick').match(/paMarkPaid\('([^']+)'/);
            if (match) {
                await fetch(CLOUD_URL, { method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: new URLSearchParams({ action: 'affiliateMarkPaid', commissionId: match[1], adminEmail: ADMIN_EMAIL, adminToken: paGetToken() }).toString() });
            }
        }
        paToast('✅ Đã duyệt tất cả!', true);
        loadAffiliate();
    };

    // ===== 2. CAFE LOGIC =====
    window.loadCafeRevenue = async function() {
        const monthPicker = document.getElementById('cafeMonthPicker');
        if (!monthPicker.value) {
            const now = new Date();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            monthPicker.value = `${now.getFullYear()}-${m}`;
        }

        const list = document.getElementById('paListCafe');
        list.innerHTML = '<div class="pa-loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...</div>';

        try {
            const res = await fetch(`${CLOUD_URL}?action=cafeAdminGetPendingRevenue&adminToken=${paGetToken()}&month=${monthPicker.value}`);
            const data = await res.json();
            if (data.status !== 200) throw new Error(data.message);

            allCafeData = data.cafes || [];

            document.getElementById('cafeTotalAmount').textContent = paFmt(data.total_amount) + 'đ';
            document.getElementById('cafeTotalUnpaid').textContent = paFmt(data.total_unpaid) + 'đ';
            document.getElementById('cafeTotalPaid').textContent = paFmt(data.total_paid) + 'đ';

            filterAndRenderCafes();

        } catch (e) {
            list.innerHTML = `<div class="pa-loading">❌ ${e.message}</div>`;
        }
    };

    window.filterAndRenderCafes = function() {
        const list = document.getElementById('paListCafe');
        const filterStatus = document.getElementById('cafePayFilter').value;

        if (allCafeData.length === 0) {
            list.innerHTML = '<div class="pa-loading">🎉 Không có dữ liệu trong tháng này!</div>';
            return;
        }

        let filteredCafes = allCafeData.map(cafe => {
            const filteredBills = cafe.bills.filter(b => {
                const bStatus = b.payment_status || 'unpaid';
                return filterStatus === 'all' || bStatus === filterStatus;
            });
            return { ...cafe, displayBills: filteredBills };
        }).filter(cafe => cafe.displayBills.length > 0);

        if (filteredCafes.length === 0) {
            list.innerHTML = `<div class="pa-loading">Không có bill nào ở trạng thái này.</div>`;
            return;
        }

        list.innerHTML = filteredCafes.map(cafe => {
            const safeId = String(cafe.cafe_id).replace(/[^a-zA-Z0-9_-]/g, '_');
            
                        const billsHtml = cafe.displayBills.map(b => {
                const isPaid = (b.payment_status || 'unpaid') === 'paid';
                const isPending = (b.confirmation_status || 'pending') === 'pending';
                
                return `
                <div class="pa-comm">
                    <div style="flex:1;">
                        <div class="pa-comm-email">${escapeHtml(b.guest_name)}</div>
                        <div class="pa-comm-meta">Ra: ${paFmtDate(b.check_out_at)} · ${b.billable_hours}h</div>
                        ${isPending ? `<div style="font-size:11px; color:#D97706; font-weight:700; margin-top:4px;"><i class="fa-solid fa-hourglass-half"></i> Chờ quán chốt bill</div>` : ''}
                    </div>
                    <div style="text-align:right;">
                        <div class="pa-comm-amount" style="color: ${isPaid ? '#059669' : '#D97706'}">${paFmt(b.revenue_amount)}đ</div>
                        <div style="font-size: 12px; font-weight: 700; margin-top: 4px; ${isPaid ? 'color:#059669;' : 'color:#DC2626;'}">
                            ${isPaid ? '<i class="fa-solid fa-check-circle"></i> Đã trả' : '<i class="fa-solid fa-clock"></i> Chưa trả'}
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            const showPayBtn = filterStatus !== 'paid' && cafe.unpaid_amount > 0;

            return `
                <div class="pa-group" id="grp_${safeId}">
                    <div class="pa-group-header" onclick="paToggleGroup('grp_', '${cafe.cafe_id}')">
                        <div style="flex:1;">
                            <div class="pa-partner-name"><i class="fa-solid fa-store"></i> ${escapeHtml(cafe.cafe_name)}</div>
                            <div style="font-size:13px;color:#64748B;">
                                Tổng: <b>${paFmt(cafe.total_amount)}đ</b> · 
                                <span style="color:#DC2626;">Nợ: ${paFmt(cafe.unpaid_amount)}đ</span>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-down pa-chevron"></i>
                    </div>
                    <div class="pa-group-body">
                        <div style="font-size:12px; font-weight:700; color:#64748B; text-transform:uppercase; margin-bottom:12px;">
                            Chi tiết (${cafe.displayBills.length} bill)
                        </div>
                        ${billsHtml}
                        ${showPayBtn ? `
                        <button class="pa-mark-all-btn" onclick="paMarkCafePaid('${cafe.cafe_id}', this)">
                            <i class="fa-solid fa-check-double"></i> Đánh dấu đã trả (${paFmt(cafe.unpaid_amount)}đ)
                        </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }).join('');

        if (filteredCafes.length === 1) list.querySelector('.pa-group').classList.add('expanded');
    };

    window.paMarkCafePaid = async function(cafeId, btn) {
        const cafe = allCafeData.find(c => c.cafe_id === cafeId);
        if (!cafe) return;
        
        // 🚨 FIX: Chỉ lấy những bill đang hiển thị là "Chưa thanh toán" trong mảng displayBills
        // (đề phòng trường hợp bill vừa confirm xong nhưng data chưa load kịp)
        const unpaidBills = cafe.bills.filter(b => b.payment_status !== 'paid');
        if (unpaidBills.length === 0) return;
        if (!confirm(`Xác nhận đã thanh toán ${paFmt(cafe.unpaid_amount)}đ cho ${cafe.cafe_name}?`)) return;

        btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý...';
        const checkinIds = unpaidBills.map(b => b.checkin_id);

        try {
            const res = await fetch(CLOUD_URL, {
                method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: new URLSearchParams({
                    action: 'cafeAdminMarkRevenuePaid',
                    adminToken: paGetToken(),
                    checkinIds: JSON.stringify(checkinIds)
                }).toString()
            });
            const data = await res.json();
            if (data.status === 200) {
                paToast('✅ Đã thanh toán thành công!', true);
                loadCafeRevenue();
            } else {
                paToast('❌ Lỗi: ' + data.message, false);
                btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-check-double"></i> Thử lại';
            }
        } catch (e) {
            paToast('❌ Lỗi kết nối', false);
            btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-check-double"></i> Thử lại';
        }
    };

    // Check token on load
    if (paGetToken()) {
        document.getElementById('paLoginScreen').style.display = 'none';
        document.getElementById('paAdminContent').style.display = 'flex';
        switchAdminView('affiliate', document.querySelector('.pa-nav-item'));
    }
</script>
</body>
</html>
